services:
  - type: web
    name: finwise-ai-server
    env: node
    plan: free
    buildCommand: npm install --prefix server
    startCommand: node server/src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: CHROMA_SERVER_HOST
        sync: false
